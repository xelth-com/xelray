[package]
name = "app_ui"
description = "XelRay browser front end — Leptos 0.6 CSR, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "app_ui_main"
path = "src/main.rs"

[dependencies]
leptos = { workspace = true }
glam = { workspace = true }
xelray_core = { path = "../xelray_core" }
console_error_panic_hook = "0.1"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = "0.3"

# wgpu only builds a canvas surface on the web, and the 3D view is the only
# thing that wants it. Host builds exist to run the unit tests, so they skip
# it entirely — see the target gate in `render3d`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# Validates `render3d/shaders.wgsl` natively — see the test in `render3d`.
naga = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "CanvasRenderingContext2d",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "ImageData",
    "KeyboardEvent",
    "HtmlSelectElement",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Request",
    "ResizeObserver",
    "ResizeObserverEntry",
    "RequestInit",
    "Response",
    "Storage",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Window",
    "WheelEvent",
]
